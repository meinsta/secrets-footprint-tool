version: '3.8'

services:
  # Assessment Tool - IP access
  assessment-tool:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.keyless
    hostname: assessment-tool
    container_name: assessment-tool
    restart: unless-stopped
    environment:
      - AUTH_MODE=certificate-only
      - ACCESS_MODE=ip-based
    volumes:
      - assessment_data:/app/data
      - assessment_logs:/app/logs
      - /var/lib/teleport:/var/lib/teleport:ro
    networks:
      - assessment_network
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # Simple web portal for IP access
  web-portal:
    image: nginx:alpine
    hostname: web-portal
    container_name: web-portal
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./portal-simple:/usr/share/nginx/html:ro
    networks:
      - assessment_network
    security_opt:
      - no-new-privileges:true

  # Monitoring for IP access
  monitoring:
    image: prom/prometheus:v2.48.0
    hostname: monitoring
    container_name: monitoring
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - assessment_network
    security_opt:
      - no-new-privileges:true
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'

volumes:
  assessment_data:
  assessment_logs:
  prometheus_data:

networks:
  assessment_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
